{% include base_path %}
{% if page.previous or page.next %}
<nav class="pager" aria-label="More in {{ page.collection | default: 'this section' }}">
  {% if page.previous %}<a class="pager-prev" href="{{ base_path }}{{ page.previous.url }}"><span>← Previous</span><b>{{ page.previous.title | markdownify | strip_html | strip }}</b></a>{% else %}<span></span>{% endif %}
  {% if page.next %}<a class="pager-next" href="{{ base_path }}{{ page.next.url }}"><span>Next →</span><b>{{ page.next.title | markdownify | strip_html | strip }}</b></a>{% endif %}
</nav>
{% endif %}
